<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>비상상황 대피자 현황 Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

<style>
:root{
  --red:#c00000;
  --green:#059669;
  --navy:#0f172a;
  --gray-50:#f8fafc;
  --gray-100:#f1f5f9;
  --gray-200:#e2e8f0;
  --gray-300:#cbd5e1;
  --gray-500:#64748b;
  --gray-600:#475569;
  --gray-700:#334155;
  --gray-900:#0f172a;
  --line:#777;
  --shadow:0 16px 40px rgba(15,23,42,.08);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html{min-height:100%;background:#f8fafc}

body{
  margin:0;
  min-height:100%;
  color:#111827;
  background:linear-gradient(180deg,#f8fafc 0%,#fff 50%);
  font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;
}

.hidden{display:none!important}

.page{
  width:min(1220px,100%);
  min-height:100vh;
  margin:0 auto;
  padding:28px 28px 24px;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:24px;
  padding:26px 30px;
  border:1px solid var(--gray-200);
  border-radius:18px;
  background:#fff;
  box-shadow:var(--shadow);
}

.title-area{min-width:0}

.page-title{
  margin:0;
  color:#050816;
  font-size:42px;
  font-weight:900;
  letter-spacing:-.06em;
  line-height:1.15;
  word-break:keep-all;
}

.scope-title{
  margin:8px 0 0;
  color:#777;
  font-size:21px;
  font-weight:900;
  line-height:1.3;
  word-break:keep-all;
}

.clock-card{
  width:260px;
  flex:0 0 auto;
  padding:18px 20px;
  border-radius:14px;
  background:var(--navy);
  color:#fff;
  text-align:right;
}

.clock-label{
  display:block;
  margin-bottom:8px;
  color:#cbd5e1;
  font-size:12px;
  font-weight:900;
}

.clock-time{
  display:block;
  font-size:18px;
  font-weight:900;
  letter-spacing:-.02em;
}

.firebase-state{
  margin-top:8px;
  font-size:12px;
  font-weight:900;
  color:#86efac;
}

.firebase-state.warn{color:#fde68a}
.firebase-state.error{color:#fca5a5}

.dashboard-main{
  padding:34px 28px 18px;
}

.training-title{
  margin:0 0 24px;
  text-align:center;
  font-size:36px;
  font-weight:900;
  letter-spacing:-.04em;
  line-height:1.25;
  word-break:keep-all;
}

.metric-strip{
  width:min(1060px,100%);
  margin:0 auto 24px;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}

.metric-card{
  min-height:82px;
  padding:14px 16px;
  border:1px solid var(--gray-200);
  border-radius:16px;
  background:#fff;
  box-shadow:0 8px 22px rgba(15,23,42,.06);
  text-align:center;
}

.metric-card span{
  display:block;
  margin-bottom:5px;
  color:var(--gray-500);
  font-size:14px;
  font-weight:900;
}

.metric-card strong{
  display:block;
  color:var(--gray-900);
  font-size:30px;
  font-weight:900;
  letter-spacing:-.04em;
}

.metric-card.checking strong{
  color:var(--red);
}

.table-shell{
  width:min(1060px,100%);
  margin:0 auto;
}

.dashboard-table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  background:#fff;
  border:2.4px solid var(--line);
}

.dashboard-table th,
.dashboard-table td{
  border:1.8px solid var(--line);
  height:58px;
  padding:7px 10px;
  text-align:center;
  vertical-align:middle;
  font-size:22px;
  font-weight:600;
  line-height:1.15;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;
}

.dashboard-table th{
  height:60px;
  font-weight:900;
  background:#fff;
}

.dashboard-table .num{
  font-weight:900;
}

.dashboard-table .checking,
.checking{
  color:var(--red);
  font-weight:900;
}

.dashboard-table .total-row td{
  height:62px;
  font-weight:900;
  background:#fff;
}

.dashboard-table .org-name{
  font-weight:800;
}

.office-table .col-no{width:8%}
.office-table .col-team{width:40%}
.office-table .col-total{width:14%}
.office-table .col-evac{width:14%}
.office-table .col-absent{width:12%}
.office-table .col-checking{width:12%}

.division-table .col-no{width:6%}
.division-table .col-office{width:27%}
.division-table .col-team{width:25%}
.division-table .col-total{width:10%}
.division-table .col-evac{width:11%}
.division-table .col-absent{width:10%}
.division-table .col-checking{width:11%}

.headquarters-table .col-no{width:6%}
.headquarters-table .col-division{width:27%}
.headquarters-table .col-office{width:29%}
.headquarters-table .col-total{width:10%}
.headquarters-table .col-evac{width:10%}
.headquarters-table .col-absent{width:9%}
.headquarters-table .col-checking{width:9%}

.mobile-cards{
  display:none;
  width:100%;
}

.mobile-card{
  border:1.5px solid var(--gray-200);
  border-radius:18px;
  background:#fff;
  box-shadow:0 8px 22px rgba(15,23,42,.06);
  overflow:hidden;
  margin-bottom:12px;
}

.mobile-card-head{
  padding:14px 15px 12px;
  border-bottom:1px solid var(--gray-200);
  background:linear-gradient(180deg,#fff 0%,#f8fafc 100%);
}

.mobile-card-role{
  margin:0 0 5px;
  color:var(--gray-500);
  font-size:12px;
  font-weight:900;
}

.mobile-card-title{
  margin:0;
  color:var(--gray-900);
  font-size:20px;
  font-weight:900;
  line-height:1.25;
  letter-spacing:-.04em;
  word-break:keep-all;
}

.mobile-card-subtitle{
  margin:5px 0 0;
  color:var(--gray-600);
  font-size:14px;
  font-weight:800;
  line-height:1.35;
  word-break:keep-all;
}

.mobile-card-body{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:0;
}

.mobile-metric{
  min-height:62px;
  padding:10px 4px;
  border-right:1px solid var(--gray-200);
  text-align:center;
}

.mobile-metric:last-child{
  border-right:0;
}

.mobile-metric span{
  display:block;
  margin-bottom:4px;
  color:var(--gray-500);
  font-size:12px;
  font-weight:900;
}

.mobile-metric strong{
  display:block;
  color:var(--gray-900);
  font-size:22px;
  font-weight:900;
  letter-spacing:-.04em;
}

.mobile-metric.checking strong{
  color:var(--red);
}

.unknown-section{
  width:min(1060px,100%);
  margin:30px auto 0;
}

.unknown-title{
  margin:0 0 10px;
  color:var(--red);
  font-size:21px;
  font-weight:900;
}

.unknown-wrap{
  max-height:calc(52px + 52px * 10 + 4px);
  overflow-y:auto;
  overflow-x:hidden;
  border:2.4px solid var(--line);
  background:#fff;
}

.unknown-table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

.unknown-table th,
.unknown-table td{
  height:52px;
  border:1.6px solid var(--line);
  padding:6px 8px;
  text-align:center;
  vertical-align:middle;
  font-size:22px;
  font-weight:600;
  line-height:1.15;
  white-space:nowrap;
  overflow:hidden;
}

.unknown-table th{
  position:sticky;
  top:0;
  z-index:2;
  background:#fff;
  font-weight:900;
}

.unknown-table .col-u-no{width:9%}
.unknown-table .col-u-team{width:43%}
.unknown-table .col-u-name{width:48%}

.notice{
  width:min(760px,100%);
  margin:60px auto;
  padding:32px 28px;
  border:1px solid var(--gray-200);
  border-radius:20px;
  background:#fff;
  box-shadow:var(--shadow);
  text-align:center;
}

.notice-title{
  margin:0 0 12px;
  font-size:28px;
  font-weight:900;
}

.notice-desc{
  margin:0;
  color:var(--gray-600);
  font-size:17px;
  font-weight:800;
  line-height:1.7;
  word-break:keep-all;
}

.footer-note{
  margin-top:26px;
  color:#777;
  font-size:13px;
  font-weight:800;
  text-align:center;
}

@media(max-width:760px){
  .page{
    width:100%;
    min-height:100dvh;
    padding:12px 10px calc(18px + var(--safe-bottom));
  }

  .top-bar{
    display:block;
    padding:18px 18px;
    border-radius:22px;
  }

  .page-title{
    font-size:34px;
    line-height:1.16;
    letter-spacing:-.07em;
  }

  .scope-title{
    margin-top:10px;
    font-size:22px;
    color:#777;
  }

  .clock-card{
    width:100%;
    margin-top:22px;
    padding:20px 20px;
    border-radius:18px;
    text-align:left;
  }

  .clock-label{
    font-size:15px;
  }

  .clock-time{
    font-size:25px;
  }

  .firebase-state{
    margin-top:12px;
    font-size:15px;
  }

  .dashboard-main{
    padding:30px 0 10px;
  }

  .training-title{
    margin:0 0 24px;
    font-size:31px;
    line-height:1.2;
  }

  .metric-strip{
    width:100%;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:6px;
    margin-bottom:18px;
  }

  .metric-card{
    min-height:66px;
    padding:10px 4px;
    border-radius:12px;
  }

  .metric-card span{
    font-size:11px;
    margin-bottom:4px;
  }

  .metric-card strong{
    font-size:22px;
  }

  .table-shell{
    display:none;
  }

  .mobile-cards{
    display:block;
  }

  .mobile-card-title.fit-small{font-size:18px;letter-spacing:-.07em}
  .mobile-card-title.fit-tiny{font-size:16px;letter-spacing:-.09em}
  .mobile-card-title.fit-micro{font-size:14px;letter-spacing:-.11em}

  .mobile-card-subtitle.fit-small{font-size:13px;letter-spacing:-.06em}
  .mobile-card-subtitle.fit-tiny{font-size:12px;letter-spacing:-.08em}
  .mobile-card-subtitle.fit-micro{font-size:11px;letter-spacing:-.1em}

  .unknown-section{
    width:100%;
    margin-top:22px;
  }

  .unknown-title{
    font-size:18px;
  }

  .unknown-wrap{
    max-height:calc(44px + 44px * 10 + 4px);
  }

  .unknown-table th,
  .unknown-table td{
    height:44px;
    padding:4px 4px;
    font-size:14px;
  }

  .unknown-table .col-u-no{width:12%}
  .unknown-table .col-u-team{width:44%}
  .unknown-table .col-u-name{width:44%}

  .notice{
    margin:30px auto;
    padding:24px 18px;
    border-radius:18px;
  }

  .notice-title{
    font-size:22px;
  }

  .notice-desc{
    font-size:14px;
  }

  .footer-note{
    margin-top:22px;
    font-size:12px;
  }
}
</style>
</head>

<body>
<div class="page">
  <header class="top-bar">
    <div class="title-area">
      <h1 id="pageTitle" class="page-title">비상상황 대피자 현황</h1>
      <p id="scopeTitle" class="scope-title">-</p>
    </div>

    <div class="clock-card">
      <span class="clock-label">현재 한국시간</span>
      <strong id="kstClock" class="clock-time">-</strong>
      <div id="firebaseState" class="firebase-state warn">Firebase 연결 확인 중</div>
    </div>
  </header>

  <main id="dashboardView" class="dashboard-main hidden">
    <h2 id="trainingTitle" class="training-title">“비상대응훈련”</h2>

    <div id="metricStrip" class="metric-strip">
      <div class="metric-card">
        <span>총원</span>
        <strong id="metricTotal">0</strong>
      </div>
      <div class="metric-card">
        <span>대피</span>
        <strong id="metricEvacuated">0</strong>
      </div>
      <div class="metric-card">
        <span>부재</span>
        <strong id="metricAbsent">0</strong>
      </div>
      <div class="metric-card checking">
        <span>확인중</span>
        <strong id="metricChecking">0</strong>
      </div>
    </div>

    <div class="table-shell">
      <table id="summaryTable" class="dashboard-table">
        <thead id="summaryHead"></thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>

    <div id="mobileCards" class="mobile-cards"></div>

    <section id="unknownSection" class="unknown-section hidden">
      <h3 id="unknownTitle" class="unknown-title">확인중 인원 0명</h3>
      <div class="unknown-wrap">
        <table class="unknown-table">
          <thead>
            <tr>
              <th class="col-u-no">순번</th>
              <th class="col-u-team">팀</th>
              <th class="col-u-name">성명</th>
            </tr>
          </thead>
          <tbody id="unknownBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <section id="noticeView" class="notice">
    <h2 id="noticeTitle" class="notice-title">확인 중입니다</h2>
    <p id="noticeDesc" class="notice-desc">대시보드 정보를 불러오고 있습니다.</p>
  </section>

  <div class="footer-note">HYUNDAI STEEL R&D CENTER</div>
</div>

<script>
/********************************************************
 * 1. Firebase 설정
 ********************************************************/
const firebaseConfig={
  apiKey: "AIzaSyCqIJHAJtFoOxeK-M9fChyPvu8z8E_pOGU",
  authDomain: "emergy-e15f5.firebaseapp.com",
  projectId: "emergy-e15f5",
  storageBucket: "emergy-e15f5.firebasestorage.app",
  messagingSenderId: "123548770828",
  appId: "1:123548770828:web:904e66916a055a52d64429"
};

const params=new URLSearchParams(location.search);

let trainingId=params.get("trainingId")||"";
const viewMode=params.get("view")||"";
const scopeName=
  params.get("office")||
  params.get("division")||
  params.get("headquarters")||
  params.get("scope")||
  params.get("name")||
  "";

let db=null;
let firebaseReady=false;
let trainingData=null;
let allMembers=[];
let filteredMembers=[];
let unsubscribeTraining=null;
let unsubscribeParticipants=null;

const $=(id)=>document.getElementById(id);

const viewConfigMap={
  office:{
    suffix:"실장",
    scopeField:"office",
    scopeLabel:"실",
    tableType:"office"
  },
  division:{
    suffix:"사업부장",
    scopeField:"division",
    scopeLabel:"사업부",
    tableType:"division"
  },
  headquarters:{
    suffix:"본부장",
    scopeField:"headquarters",
    scopeLabel:"본부",
    tableType:"headquarters"
  }
};

const viewConfig=viewConfigMap[viewMode]||null;

function init(){
  updateClock();
  setInterval(updateClock,1000);

  if(!viewConfig){
    showNotice(
      "대시보드 링크 오류",
      "view 값이 올바르지 않습니다. view=office, view=division, view=headquarters 중 하나를 사용해주세요.",
      true
    );
    return;
  }

  if(!scopeName){
    showNotice(
      "대시보드 링크 오류",
      "조회할 조직명이 없습니다. office, division, headquarters 파라미터를 확인해주세요.",
      true
    );
    return;
  }

  setHeaderByMode();

  if(!initFirebaseSafely())return;

  showNotice("대시보드 연결 중", "현재 비상상황 정보를 찾고 있습니다.");

  resolveTrainingForDashboard()
    .then(()=>{
      subscribeTraining();
      subscribeParticipants();
    })
    .catch((err)=>{
      console.error(err);
      showNotice(
        "대시보드 정보를 찾지 못했습니다",
        "현재 링크에 해당하는 비상상황 데이터를 찾지 못했습니다.<br>관리자 페이지에서 훈련이 저장되었는지, 참석자 명단의 본부/사업부/실 명칭이 링크와 일치하는지 확인해주세요.",
        true
      );
      setFirebaseState("대시보드 탐색 실패","error");
    });
}

function initFirebaseSafely(){
  try{
    if(typeof firebase==="undefined")throw new Error("Firebase SDK가 로드되지 않았습니다.");
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    db=firebase.firestore();
    firebaseReady=true;
    setFirebaseState("Firebase 연결 준비 완료","ok");
    return true;
  }catch(err){
    console.error(err);
    firebaseReady=false;
    setFirebaseState("Firebase 연결 실패","error");
    showNotice(
      "Firebase 연결 실패",
      "firebaseConfig 값, Firestore 생성 여부, API Key 제한을 확인해주세요.",
      true
    );
    return false;
  }
}

function ensureFirebaseReady(){
  if(!firebaseReady||!db){
    throw new Error("Firebase 연결 실패");
  }
}

function setHeaderByMode(){
  $("pageTitle").textContent=`비상상황 대피자 현황_${viewConfig.suffix}`;
  $("scopeTitle").textContent=scopeName;
}

function setFirebaseState(text,type){
  const el=$("firebaseState");
  if(!el)return;
  el.textContent=text;
  el.className=`firebase-state ${type||""}`;
}

function showNotice(title,desc,isError=false){
  $("dashboardView").classList.add("hidden");
  $("noticeView").classList.remove("hidden");
  $("noticeTitle").textContent=title;
  $("noticeDesc").innerHTML=desc;
  $("noticeTitle").style.color=isError?"var(--red)":"#111827";
}

function showDashboard(){
  $("noticeView").classList.add("hidden");
  $("dashboardView").classList.remove("hidden");
}

function pad2(v){
  return String(v).padStart(2,"0");
}

function getKstDate(date=new Date()){
  return new Date(date.getTime()+9*60*60*1000);
}

function getKstParts(date=new Date()){
  const k=getKstDate(date);
  return{
    year:k.getUTCFullYear(),
    month:k.getUTCMonth()+1,
    day:k.getUTCDate(),
    hour:k.getUTCHours(),
    minute:k.getUTCMinutes(),
    second:k.getUTCSeconds()
  };
}

function updateClock(){
  const p=getKstParts();
  $("kstClock").textContent=`${p.year}.${pad2(p.month)}.${pad2(p.day)} ${pad2(p.hour)}:${pad2(p.minute)}:${pad2(p.second)}`;
}

function toMillis(value){
  if(!value)return 0;
  if(typeof value.toMillis==="function")return value.toMillis();
  if(typeof value.toDate==="function")return value.toDate().getTime();
  const ms=new Date(value).getTime();
  return Number.isNaN(ms)?0:ms;
}

function trainingRef(){
  ensureFirebaseReady();
  return db.collection("emergencyTrainings").doc(trainingId);
}

function participantsRef(){
  return trainingRef().collection("participants");
}

/********************************************************
 * 2. trainingId 없이 조직명으로 현재 훈련 찾기
 ********************************************************/
async function resolveTrainingForDashboard(){
  ensureFirebaseReady();

  if(trainingId){
    return trainingId;
  }

  const snapshot=await db.collection("emergencyTrainings").get();

  const trainings=snapshot.docs
    .map(doc=>({id:doc.id,...doc.data()}))
    .filter(t=>t.startAt&&t.endAt);

  if(trainings.length===0){
    throw new Error("훈련 문서 없음");
  }

  const nowMs=Date.now();

  const active=trainings
    .filter(t=>toMillis(t.startAt)<=nowMs&&nowMs<=toMillis(t.endAt))
    .sort((a,b)=>toMillis(b.startAt)-toMillis(a.startAt));

  const future=trainings
    .filter(t=>toMillis(t.startAt)>nowMs)
    .sort((a,b)=>toMillis(a.startAt)-toMillis(b.startAt));

  const ended=trainings
    .filter(t=>toMillis(t.endAt)<nowMs)
    .sort((a,b)=>toMillis(b.endAt)-toMillis(a.endAt));

  const candidates=[...active,...future,...ended];

  for(const training of candidates){
    if(trainingScopeArrayMatches(training)){
      trainingId=training.id;
      return trainingId;
    }
  }

  for(const training of candidates){
    const hasScope=await trainingHasScope(training.id);
    if(hasScope){
      trainingId=training.id;
      return trainingId;
    }
  }

  throw new Error("해당 조직이 포함된 훈련 없음");
}

function trainingScopeArrayMatches(training){
  const scopeKey=normalizeText(scopeName);

  if(viewConfig.scopeField==="headquarters"){
    return Array.isArray(training.headquartersKeys)&&training.headquartersKeys.includes(scopeKey);
  }

  if(viewConfig.scopeField==="division"){
    return Array.isArray(training.divisionKeys)&&training.divisionKeys.includes(scopeKey);
  }

  if(viewConfig.scopeField==="office"){
    return Array.isArray(training.officeKeys)&&training.officeKeys.includes(scopeKey);
  }

  return false;
}

async function trainingHasScope(candidateTrainingId){
  const snap=await db
    .collection("emergencyTrainings")
    .doc(candidateTrainingId)
    .collection("participants")
    .limit(1500)
    .get();

  return snap.docs.some(doc=>{
    const p=doc.data();
    return normalizeText(getScopeValue(p,viewConfig.scopeField))===normalizeText(scopeName);
  });
}

/********************************************************
 * 3. 실시간 구독
 ********************************************************/
function subscribeTraining(){
  try{
    if(unsubscribeTraining)unsubscribeTraining();

    unsubscribeTraining=trainingRef().onSnapshot(doc=>{
      if(!doc.exists){
        showNotice("훈련 정보 없음","해당 비상상황 정보를 찾을 수 없습니다.",true);
        return;
      }

      trainingData={id:doc.id,...doc.data()};
      $("trainingTitle").textContent=`“${trainingData.trainingName||"비상대응훈련"}”`;
      setFirebaseState("Firebase 연결 정상","ok");
      renderDashboard();
    },err=>{
      console.error(err);
      setFirebaseState("Firebase 오류 발생","error");
      showNotice("훈련 정보 불러오기 실패","Firestore 권한 또는 네트워크 상태를 확인해주세요.",true);
    });
  }catch(err){
    console.error(err);
  }
}

function subscribeParticipants(){
  try{
    if(unsubscribeParticipants)unsubscribeParticipants();

    unsubscribeParticipants=participantsRef().onSnapshot(snapshot=>{
      allMembers=snapshot.docs.map(doc=>({id:doc.id,ref:doc.ref,...doc.data()}));
      allMembers.sort((a,b)=>Number(a.order||0)-Number(b.order||0));

      filteredMembers=allMembers.filter(p=>
        normalizeText(getScopeValue(p,viewConfig.scopeField))===normalizeText(scopeName)
      );

      setFirebaseState("Firebase 연결 정상","ok");
      renderDashboard();
    },err=>{
      console.error(err);
      setFirebaseState("Firebase 오류 발생","error");
      showNotice("참석자 정보 불러오기 실패","Firestore 권한 또는 네트워크 상태를 확인해주세요.",true);
    });
  }catch(err){
    console.error(err);
  }
}

/********************************************************

 ********************************************************/
function renderDashboard(){
  if(!trainingData)return;
  if(!filteredMembers)return;

  showDashboard();
  renderMetricStrip();

  if(viewConfig.tableType==="office"){
    renderOfficeDashboard();
    renderUnknownList();
    return;
  }

  $("unknownSection").classList.add("hidden");

  if(viewConfig.tableType==="division"){
    renderDivisionDashboard();
    return;
  }

  if(viewConfig.tableType==="headquarters"){
    renderHeadquartersDashboard();
    return;
  }
}

function renderMetricStrip(){
  const total=countMembers(filteredMembers);

  $("metricTotal").textContent=total.total;
  $("metricEvacuated").textContent=total.evacuated;
  $("metricAbsent").textContent=total.absent;
  $("metricChecking").textContent=total.checking;
}

function renderMobileCards(rows,type){
  const box=$("mobileCards");

  if(!rows||rows.length===0){
    box.innerHTML=`
      <div class="mobile-card">
        <div class="mobile-card-head">
          <p class="mobile-card-role">안내</p>
          <h3 class="mobile-card-title">표시할 데이터가 없습니다.</h3>
        </div>
      </div>
    `;
    return;
  }

  box.innerHTML=rows.map(row=>{
    const title=row.title||"-";
    const subtitle=row.subtitle||row.role||"";
    const roleText=getMobileRoleLabel(type,row);

    return`
      <article class="mobile-card">
        <div class="mobile-card-head">
          <p class="mobile-card-role">${escapeHtml(roleText)}</p>
          <h3 class="mobile-card-title ${getNameFitClass(title)}">${escapeHtml(title)}</h3>
          ${subtitle?`<p class="mobile-card-subtitle ${getNameFitClass(subtitle)}">${escapeHtml(subtitle)}</p>`:""}
        </div>
        <div class="mobile-card-body">
          <div class="mobile-metric">
            <span>총원</span>
            <strong>${row.total}</strong>
          </div>
          <div class="mobile-metric">
            <span>대피</span>
            <strong>${row.evacuated}</strong>
          </div>
          <div class="mobile-metric">
            <span>부재</span>
            <strong>${row.absent}</strong>
          </div>
          <div class="mobile-metric checking">
            <span>확인중</span>
            <strong>${row.checking}</strong>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

function getMobileRoleLabel(type,row){
  if(type==="office")return"팀별 현황";
  if(type==="division")return"실 / 팀별 현황";
  if(type==="headquarters")return"사업부 / 실별 현황";
  return"현황";
}

function renderUnknownList(){
  const unknown=filteredMembers
    .filter(p=>getPersonStatus(p)==="확인중")
    .sort((a,b)=>Number(a.order||0)-Number(b.order||0));

  $("unknownSection").classList.remove("hidden");
  $("unknownTitle").textContent=`확인중 인원 ${unknown.length}명`;

  if(unknown.length===0){
    $("unknownBody").innerHTML=`
      <tr>
        <td colspan="3">확인중 인원이 없습니다.</td>
      </tr>
    `;
    return;
  }

  $("unknownBody").innerHTML=unknown.map((p,i)=>{
    const team=getScopeValue(p,"team")||"-";
    const name=p.name||"-";

    return`
      <tr>
        <td>${i+1}</td>
        <td class="org-name ${getNameFitClass(team)}">${escapeHtml(team)}</td>
        <td class="org-name">${escapeHtml(name)}</td>
      </tr>
    `;
  }).join("");
}

/********************************************************
 * 5. 집계 함수
 ********************************************************/
function countMembers(members){
  const total=members.length;
  const evacuated=members.filter(p=>getPersonStatus(p)==="대피완료").length;
  const absent=members.filter(p=>isAbsentStatus(getPersonStatus(p))).length;
  const checking=total-evacuated-absent;

  return{
    total,
    evacuated,
    absent,
    checking
  };
}

function getPersonStatus(person){
  if(person.status)return person.status;
  if(person.checked===true)return"대피완료";
  if(person.absenceReason)return person.absenceReason;
  return"확인중";
}

function isAbsentStatus(status){
  return["타 본부","휴가","출장","외출"].includes(status);
}

function groupBy(array,getKey){
  return array.reduce((acc,item)=>{
    const key=getKey(item)||"-";
    if(!acc[key])acc[key]=[];
    acc[key].push(item);
    return acc;
  },{});
}

function getMinOrder(members){
  const values=members
    .map(m=>Number(m.order||999999))
    .filter(v=>!Number.isNaN(v));

  return values.length?Math.min(...values):999999;
}

function getScopeValue(person,field){
  if(field==="headquarters"){
    return person.headquarters||person.headquarter||person.hq||person.bonbu||person["본부"]||"";
  }

  if(field==="division"){
    return person.division||person.businessDivision||person.bizDivision||person.saupbu||person["사업부"]||"";
  }

  if(field==="office"){
    return person.office||person.officeName||person.sil||person["실"]||"";
  }

  if(field==="team"){
    return person.team||person.teamName||person.teamNm||person["팀"]||"";
  }

  return person[field]||"";
}

function getNameFitClass(text){
  const len=String(text||"").replace(/\s+/g,"").length;

  if(len>=15)return"fit-micro";
  if(len>=12)return"fit-tiny";
  if(len>=9)return"fit-small";
  return"";
}

function normalizeText(value){
  return String(value||"")
    .trim()
    .replace(/\s+/g,"")
    .replaceAll("ㆍ","·")
    .replaceAll("/","·")
    .toLowerCase();
}

function escapeHtml(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
