<!DOCTYPE html>
<html lang="ko">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />

 <title>비상대응훈련 참석자 출석</title>

 <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
 <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

 <style>
   :root {
     --black:#111827;
     --red:#c00000;
     --blue:#2563eb;
     --green:#059669;
     --yellow:#ca8a04;
     --gray-50:#f8fafc;
     --gray-100:#f1f5f9;
     --gray-200:#e2e8f0;
     --gray-300:#cbd5e1;
     --gray-500:#64748b;
     --gray-700:#334155;
     --gray-900:#0f172a;
     --line:#8a8a8a;
     --shadow:0 16px 40px rgba(15,23,42,.08);
   }

   * {
     box-sizing:border-box;
   }

   body {
     margin:0;
     background:linear-gradient(180deg,#f8fafc 0%,#ffffff 45%);
     color:var(--black);
     font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;
   }

   .page {
     width:min(1280px,100%);
     min-height:100vh;
     margin:0 auto;
     padding:28px 24px 24px;
     display:flex;
     flex-direction:column;
   }

   .top-bar {
     display:flex;
     justify-content:space-between;
     align-items:flex-start;
     gap:16px;
     margin-bottom:22px;
     padding:18px 22px;
     border:1px solid var(--gray-200);
     border-radius:20px;
     background:#fff;
     box-shadow:var(--shadow);
   }

   .brand {
     min-width:0;
   }

   .eyebrow {
     margin:0 0 5px;
     color:var(--red);
     font-size:13px;
     font-weight:900;
     letter-spacing:.12em;
   }

   .brand-title {
     margin:0;
     font-size:28px;
     font-weight:900;
     letter-spacing:-.04em;
   }

   .brand-desc {
     margin:7px 0 0;
     color:var(--gray-500);
     font-size:13px;
     font-weight:700;
     line-height:1.5;
   }

   .clock-card {
     min-width:260px;
     padding:14px 16px;
     border-radius:16px;
     background:var(--gray-900);
     color:#fff;
     text-align:right;
   }

   .clock-card span {
     display:block;
     margin-bottom:6px;
     color:#cbd5e1;
     font-size:12px;
     font-weight:800;
   }

   .clock-card strong {
     display:block;
     font-size:19px;
     letter-spacing:-.02em;
   }

   .connection-state {
     margin-top:8px;
     font-size:12px;
     font-weight:800;
     color:#cbd5e1;
     line-height:1.35;
   }

   .connection-state.ok {
     color:#86efac;
   }

   .connection-state.warn {
     color:#fde68a;
   }

   .connection-state.error {
     color:#fca5a5;
   }

   .hidden {
     display:none !important;
   }

   .check-layout {
     flex:1;
     display:flex;
     justify-content:center;
     align-items:center;
     padding:22px 0 60px;
   }

   .check-card {
     width:min(920px,94vw);
     min-height:520px;
     border:5px solid #111;
     border-radius:86px;
     background:#fff;
     padding:52px 64px;
     display:flex;
     flex-direction:column;
     justify-content:center;
     box-shadow:var(--shadow);
   }

   .status-area {
     text-align:center;
     margin-bottom:18px;
   }

   .status-pill {
     display:inline-flex;
     justify-content:center;
     align-items:center;
     min-height:34px;
     padding:0 15px;
     border-radius:999px;
     font-size:14px;
     font-weight:900;
   }

   .status-pill.open {
     background:#ecfdf5;
     color:#047857;
   }

   .status-pill.wait {
     background:#fff7ed;
     color:#c2410c;
   }

   .status-pill.closed {
     background:#f1f5f9;
     color:#475569;
   }

   .status-pill.error {
     background:#fef2f2;
     color:var(--red);
   }

   .training-name-text {
     text-align:center;
     font-size:22px;
     font-weight:900;
     color:var(--gray-500);
     margin-bottom:14px;
     word-break:keep-all;
     line-height:1.4;
   }

   .check-title {
     text-align:center;
     font-size:44px;
     font-weight:600;
     letter-spacing:-.04em;
     margin:0 0 66px;
     line-height:1.25;
     word-break:keep-all;
   }

   .form-row {
     display:grid;
     grid-template-columns:150px 1fr;
     gap:22px;
     align-items:center;
     width:min(640px,100%);
     margin:0 auto 28px;
   }

   .form-row label {
     font-size:38px;
     font-weight:500;
     text-align:right;
     white-space:nowrap;
   }

   .form-row input {
     height:62px;
     border:2px solid #888;
     padding:0 18px;
     font-size:30px;
     font-family:inherit;
     outline:none;
     border-radius:0;
     background:#fff;
   }

   .form-row input:focus {
     border-color:var(--blue);
     box-shadow:0 0 0 4px rgba(37,99,235,.12);
   }

   .button-area {
     width:min(660px,100%);
     margin:20px auto 0;
     display:flex;
     justify-content:center;
     gap:12px;
     flex-wrap:wrap;
   }

   button {
     min-height:52px;
     border:0;
     border-radius:12px;
     padding:0 30px;
     background:#111827;
     color:#fff;
     font-size:20px;
     font-weight:900;
     font-family:inherit;
     cursor:pointer;
   }

   button:hover {
     filter:brightness(.94);
   }

   button.red {
     background:var(--red);
   }

   button.gray {
     background:var(--gray-700);
   }

   button.green {
     background:var(--green);
   }

   button:disabled {
     opacity:.45;
     cursor:not-allowed;
   }

   .message {
     width:min(760px,100%);
     min-height:28px;
     margin:22px auto 0;
     text-align:center;
     font-size:18px;
     font-weight:900;
     line-height:1.55;
     color:var(--gray-700);
     word-break:keep-all;
   }

   .message.ok {
     color:var(--green);
   }

   .message.warn {
     color:var(--yellow);
   }

   .message.error {
     color:var(--red);
   }

   .list-view {
     padding-top:6px;
   }

   .list-head {
     position:relative;
     text-align:center;
     margin:0 0 34px;
     min-height:128px;
   }

   .list-training-name {
     font-size:24px;
     font-weight:900;
     color:var(--gray-500);
     margin-bottom:8px;
     word-break:keep-all;
     line-height:1.35;
   }

   .list-title {
     margin:0;
     font-size:42px;
     font-weight:600;
     line-height:1.25;
     letter-spacing:-.04em;
     word-break:keep-all;
   }

   .list-subtitle {
     margin:7px 0 0;
     font-size:32px;
     font-weight:500;
     letter-spacing:-.04em;
   }

   .current-time {
     position:absolute;
     right:8px;
     bottom:2px;
     font-size:24px;
     font-weight:500;
     white-space:nowrap;
   }

   .list-tools {
     display:flex;
     justify-content:space-between;
     align-items:center;
     gap:12px;
     margin:0 0 12px;
   }

   .small-info {
     color:var(--gray-500);
     font-size:15px;
     font-weight:900;
     line-height:1.5;
     word-break:keep-all;
   }

   .list-tools button {
     min-height:40px;
     padding:0 18px;
     font-size:15px;
     border-radius:9px;
   }

   .table-wrap {
     width:100%;
     border:2px solid #222;
     overflow-x:hidden;
     overflow-y:auto;
     max-height:720px;
     background:#fff;
   }

   table {
     width:100%;
     border-collapse:collapse;
     table-layout:fixed;
     font-size:24px;
   }

   th,
   td {
     height:54px;
     border:1px solid var(--line);
     padding:6px 8px;
     text-align:center;
     vertical-align:middle;
     word-break:keep-all;
     overflow-wrap:anywhere;
   }

   th {
     position:sticky;
     top:0;
     z-index:1;
     background:#fff;
     font-weight:900;
   }

   .col-no { width:8%; }
   .col-team { width:24%; }
   .col-affiliation { width:25%; }
   .col-name { width:20%; }
   .col-check { width:18%; }
   .col-time { width:30%; }

   .complete {
     font-weight:900;
     color:#111;
   }

   .empty-row {
     height:92px;
     color:var(--gray-500);
     font-size:18px;
     font-weight:800;
   }

   .fatal {
     flex:1;
     display:flex;
     justify-content:center;
     align-items:center;
     padding:60px 20px;
     text-align:center;
   }

   .fatal-box {
     width:min(720px,100%);
     padding:34px 28px;
     border:1px solid #fecaca;
     border-radius:22px;
     background:#fff5f5;
     color:var(--red);
     font-size:19px;
     font-weight:900;
     line-height:1.7;
     box-shadow:var(--shadow);
     word-break:keep-all;
   }

   .footer-note {
     margin-top:auto;
     padding-top:24px;
     color:#777;
     font-size:15px;
   }

   @media (max-width: 820px) {
     .page {
       padding:18px 12px 18px;
     }

     .top-bar {
       flex-direction:column;
       padding:17px 16px;
     }

     .brand-title {
       font-size:23px;
     }

     .clock-card {
       width:100%;
       min-width:0;
       text-align:left;
     }

     .check-card {
       min-height:430px;
       border-width:4px;
       border-radius:46px;
       padding:38px 22px;
     }

     .training-name-text {
       font-size:17px;
     }

     .check-title {
       font-size:30px;
       margin-bottom:42px;
     }

     .form-row {
       grid-template-columns:88px 1fr;
       gap:12px;
       margin-bottom:20px;
     }

     .form-row label {
       font-size:25px;
     }

     .form-row input {
       height:50px;
       font-size:22px;
     }

     button {
       min-height:48px;
       font-size:17px;
       padding:0 22px;
     }

     .message {
       font-size:15px;
     }

     .list-head {
       min-height:140px;
       margin-bottom:22px;
     }

     .list-training-name {
       font-size:18px;
     }

     .list-title {
       font-size:28px;
     }

     .list-subtitle {
       font-size:21px;
     }

     .current-time {
       position:static;
       margin-top:16px;
       font-size:18px;
     }

     .list-tools {
       flex-direction:column;
       align-items:stretch;
     }

     table {
       font-size:14px;
     }

     th,
     td {
       height:44px;
       padding:5px 4px;
     }

     .col-no { width:8%; }
     .col-team,
     .col-affiliation { width:25%; }
     .col-name { width:19%; }
     .col-check { width:18%; }
     .col-time { width:30%; }

     .footer-note {
       font-size:12px;
     }
   }
 </style>
</head>

<body>
 <div class="page">
   <header class="top-bar">
     <div class="brand">
       <p class="eyebrow">EMERGENCY RESPONSE TRAINING</p>
       <h1 class="brand-title">비상대응훈련 참석자 출석</h1>
       <p class="brand-desc">
         일반 팀은 팀 QR로 현재 훈련을 자동 탐색하고, 협력·외주는 훈련별 QR로 출석합니다.
       </p>
     </div>

     <div class="clock-card">
       <span>현재 한국시간</span>
       <strong id="kstClock">-</strong>
       <div id="firebaseState" class="connection-state warn">Firebase 연결 확인 중</div>
     </div>
   </header>

   <section id="fatalView" class="fatal hidden">
     <div id="fatalBox" class="fatal-box"></div>
   </section>

   <section id="checkView" class="check-layout hidden">
     <div class="check-card">
       <div class="status-area">
         <span id="statusPill" class="status-pill">-</span>
       </div>

       <div id="trainingNameText" class="training-name-text">-</div>

       <h1 id="checkTitle" class="check-title">팀명</h1>

       <div id="internalForm">
         <div class="form-row">
           <label for="empNoInput">사번 :</label>
           <input id="empNoInput" inputmode="numeric" autocomplete="off" />
         </div>

         <div class="button-area">
           <button class="red" onclick="checkInternalAttendance()">출석체크</button>
           <button class="gray" onclick="showListOnly()">명단 보기</button>
         </div>
       </div>

       <div id="externalForm" class="hidden">
         <div class="form-row">
           <label for="affiliationInput">소속 :</label>
           <input id="affiliationInput" autocomplete="organization" />
         </div>

         <div class="form-row">
           <label for="externalNameInput">성명 :</label>
           <input id="externalNameInput" autocomplete="name" />
         </div>

         <div class="button-area">
           <button class="red" onclick="checkExternalAttendance()">출석체크</button>
           <button class="gray" onclick="showListOnly()">명단 보기</button>
         </div>
       </div>

       <div id="formMessage" class="message"></div>
     </div>
   </section>

   <section id="listView" class="list-view hidden">
     <div class="list-head">
       <div id="listTrainingName" class="list-training-name">-</div>
       <h1 id="listTitle" class="list-title">팀명</h1>
       <div class="list-subtitle">비상대응훈련 참석자 출석 명단</div>
       <div id="currentTime" class="current-time">-</div>
     </div>

     <div class="list-tools">
       <div id="listInfo" class="small-info">-</div>
       <button id="backToCheckBtn" class="red" onclick="showCheckForm()">출석 화면으로 돌아가기</button>
     </div>

     <div class="table-wrap">
       <table>
         <thead id="tableHead"></thead>
         <tbody id="tableBody">
           <tr>
             <td colspan="5" class="empty-row">출석 명단을 불러오는 중입니다.</td>
           </tr>
         </tbody>
       </table>
     </div>
   </section>

   <div class="footer-note">
     본 문서는 현대제철의 정보자산으로 관련 법령에 의해 보호 받습니다.
   </div>
 </div>

 <script>
   /********************************************************
    * 1. Firebase 설정
    * 관리자용 admin.html과 동일한 firebaseConfig를 입력하세요.
    ********************************************************/
   const firebaseConfig = {
  apiKey: "AIzaSyCqIJHAJtFoOxeK-M9fChyPvu8z8E_pOGU",
  authDomain: "emergy-e15f5.firebaseapp.com",
  projectId: "emergy-e15f5",
  storageBucket: "emergy-e15f5.firebasestorage.app",
  messagingSenderId: "123548770828",
  appId: "1:123548770828:web:904e66916a055a52d64429"
   };

   /********************************************************
    * 2. URL / 전역 상태
    ********************************************************/
   const params = new URLSearchParams(location.search);

   /*
     일반 팀:
     participant.html?team=R%26D안전인프라팀

     협력·외주:
     participant.html?team=협력%C2%B7외주&trainingId=훈련ID&external=1
   */
   let trainingId = params.get("trainingId") || "";
   const teamName = params.get("team") || "";

   const isExternal =
     params.get("external") === "1" ||
     params.get("type") === "external" ||
     normalizeText(teamName) === normalizeText("협력·외주") ||
     normalizeText(teamName) === normalizeText("협력/외주");

   let db = null;
   let firebaseReady = false;

   let trainingData = null;
   let participants = [];
   let externalParticipants = [];
   let duplicateActiveTrainingDetected = false;
   let userCheckedInThisSession = false;

   let unsubscribeTraining = null;
   let unsubscribeParticipants = null;
   let unsubscribeExternalParticipants = null;

   const $ = (id) => document.getElementById(id);

   /********************************************************
    * 3. Firebase 안전 초기화
    ********************************************************/
   function initFirebaseSafely() {
     try {
       if (typeof firebase === "undefined") {
         throw new Error("Firebase SDK가 로드되지 않았습니다.");
       }

       if (!firebase.apps.length) {
         firebase.initializeApp(firebaseConfig);
       }

       db = firebase.firestore();
       firebaseReady = true;

       setFirebaseState("Firebase 연결 준비 완료", "ok");
       return true;
     } catch (err) {
       console.error("Firebase 초기화 오류:", err);

       db = null;
       firebaseReady = false;

       setFirebaseState("Firebase 연결 실패 · 설정값 확인 필요", "error");
       showFatalError(
         "Firebase 연결에 실패했습니다.<br>" +
         "firebaseConfig 값, API Key 제한, Firestore 생성 여부를 확인해주세요.<br>" +
         "현재 한국시간 표시는 계속 작동합니다."
       );

       return false;
     }
   }

   function ensureFirebaseReady() {
     if (!firebaseReady || !db) {
       setFirebaseState("Firebase 연결 실패", "error");
       throw new Error("Firebase 연결 실패");
     }
   }

   function setFirebaseState(text, type) {
     const el = $("firebaseState");
     if (!el) return;

     el.textContent = text;
     el.className = `connection-state ${type || ""}`;
   }

   function handleFirestoreError(err, place) {
     console.error(`${place} 오류:`, err);

     let message = `${place} 중 오류가 발생했습니다.`;

     if (err && err.code === "permission-denied") {
       message =
         `${place} 실패: Firestore 보안 규칙 권한이 없습니다.<br>` +
         `emergencyTrainings, participants, externalParticipants 읽기/쓰기 권한을 확인해주세요.`;
     } else if (err && err.code === "failed-precondition") {
       message =
         `${place} 실패: Firestore 인덱스 또는 데이터베이스 설정이 필요할 수 있습니다.`;
     } else if (err && err.message) {
       message = `${place} 실패: ${escapeHtml(err.message)}`;
     }

     setFirebaseState("Firebase 오류 발생", "error");
     showFatalError(message);
   }

   /********************************************************
    * 4. 한국시간 유틸
    ********************************************************/
   function pad2(value) {
     return String(value).padStart(2, "0");
   }

   function getKstDate(date = new Date()) {
     return new Date(date.getTime() + 9 * 60 * 60 * 1000);
   }

   function getKstParts(date = new Date()) {
     const kst = getKstDate(date);

     return {
       year: kst.getUTCFullYear(),
       month: kst.getUTCMonth() + 1,
       day: kst.getUTCDate(),
       hour: kst.getUTCHours(),
       minute: kst.getUTCMinutes(),
       second: kst.getUTCSeconds()
     };
   }

   function formatKst(value, withSeconds = true) {
     if (!value) return "";

     let date;

     if (typeof value.toDate === "function") {
       date = value.toDate();
     } else {
       date = new Date(value);
     }

     const p = getKstParts(date);

     const time = withSeconds
       ? `${pad2(p.hour)}:${pad2(p.minute)}:${pad2(p.second)}`
       : `${pad2(p.hour)}:${pad2(p.minute)}`;

     return `${p.year}.${pad2(p.month)}.${pad2(p.day)}. ${time}`;
   }

   function formatKoreanDateTime(value) {
     if (!value) return "";

     let date;

     if (typeof value.toDate === "function") {
       date = value.toDate();
     } else {
       date = new Date(value);
     }

     const p = getKstParts(date);

     return `${p.year}년 ${p.month}월 ${p.day}일 ${pad2(p.hour)}:${pad2(p.minute)}`;
   }

   function updateClock() {
     const now = new Date();

     const p = getKstParts(now);
     $("kstClock").textContent =
       `${p.year}.${pad2(p.month)}.${pad2(p.day)} ${pad2(p.hour)}:${pad2(p.minute)}:${pad2(p.second)}`;

     $("currentTime").textContent = formatKoreanDateTime(now);

     if (trainingData) {
       renderStatus();
       applyTimeBasedView();
       renderListInfo();
     }
   }

   /********************************************************
    * 5. Firestore 경로
    ********************************************************/
   function trainingRef() {
     ensureFirebaseReady();
     return db.collection("emergencyTrainings").doc(trainingId);
   }

   function participantsRef() {
     return trainingRef().collection("participants");
   }

   function externalParticipantsRef() {
     return trainingRef().collection("externalParticipants");
   }

   /********************************************************
    * 6. 초기 실행
    ********************************************************/
   function init() {
     $("checkTitle").textContent = teamName || "팀명";
     $("listTitle").textContent = teamName || "팀명";

     updateClock();
     setInterval(updateClock, 1000);

     if (!teamName) {
       showFatalError(
         "참석자 링크가 올바르지 않습니다.<br>" +
         "관리자용 웹앱에서 생성된 팀별 QR 링크로 접속해주세요.<br><br>" +
         "필요 값: team"
       );
       setFirebaseState("링크 정보 오류", "error");
       return;
     }

     /*
       협력·외주는 반드시 trainingId가 필요.
       일반 팀은 trainingId 없이 team만으로 현재 훈련 자동 탐색.
     */
     if (isExternal && !trainingId) {
       showFatalError(
         "협력·외주 참석자 링크가 올바르지 않습니다.<br>" +
         "협력·외주 링크에는 trainingId가 포함되어야 합니다.<br>" +
         "관리자용 웹앱에서 생성된 협력·외주 QR 링크로 접속해주세요."
       );
       setFirebaseState("협력·외주 링크 오류", "error");
       return;
     }

     const ok = initFirebaseSafely();

     if (!ok) return;

     resolveTrainingByTeam()
       .then(() => {
         subscribeTraining();
         subscribeAttendanceList();
       })
       .catch((err) => {
         console.error(err);

         showFatalError(
           "해당 팀의 비상대응훈련을 찾지 못했습니다.<br>" +
           "관리자에게 QR 링크 또는 훈련 등록 상태를 확인해주세요."
         );

         setFirebaseState("훈련 자동 탐색 실패", "error");
       });
   }

   /********************************************************
    * 7. team 기준 훈련 자동 탐색
    ********************************************************/
   async function resolveTrainingByTeam() {
     ensureFirebaseReady();

     /*
       협력·외주 또는 trainingId가 이미 있는 경우는 그대로 사용.
     */
     if (trainingId) {
       return trainingId;
     }

     /*
       일반 팀은 team만으로 훈련 자동 탐색.
     */
     const teamKey = normalizeTeamKey(teamName);
     const now = new Date();
     const nowMs = now.getTime();

     const snapshot = await db.collection("emergencyTrainings")
       .where("teamKeys", "array-contains", teamKey)
       .get();

     const candidates = snapshot.docs
       .map((doc) => ({
         id: doc.id,
         ...doc.data()
       }))
       .filter((training) => {
         if (!training.startAt || !training.endAt) return false;

         const keys = Array.isArray(training.teamKeys)
           ? training.teamKeys
           : Array.isArray(training.teams)
             ? training.teams.map((team) => normalizeTeamKey(team))
             : [];

         return keys.includes(teamKey);
       });

     if (candidates.length === 0) {
       throw new Error("해당 팀이 포함된 훈련 없음");
     }

     /*
       1순위: 현재 출석 가능 시간 안에 있는 훈련
     */
     const activeTrainings = candidates.filter((training) => {
       const startMs = training.startAt.toDate().getTime();
       const endMs = training.endAt.toDate().getTime();

       return startMs <= nowMs && nowMs <= endMs;
     });

     if (activeTrainings.length === 1) {
       trainingId = activeTrainings[0].id;
       return trainingId;
     }

     /*
       같은 팀이 현재 시간대에 2개 이상 훈련에 잡혀 있으면 중복 감지.
       관리자용에서 저장 단계에서 막지만, 참여자용에서도 한 번 더 방어.
     */
     if (activeTrainings.length >= 2) {
       duplicateActiveTrainingDetected = true;
       trainingId = activeTrainings[0].id;
       return trainingId;
     }

     /*
       2순위: 이미 종료된 가장 최근 훈련
       출석 시간이 지난 경우 바로 출석 명단 화면을 보여주기 위함.
     */
     const endedTrainings = candidates
       .filter((training) => training.endAt.toDate().getTime() < nowMs)
       .sort((a, b) => b.endAt.toDate().getTime() - a.endAt.toDate().getTime());

     if (endedTrainings.length > 0) {
       trainingId = endedTrainings[0].id;
       return trainingId;
     }

     /*
       3순위: 아직 시작 전인 가장 가까운 훈련
       출석 시작 전이면 명단 화면으로 이동.
     */
     const futureTrainings = candidates
       .filter((training) => training.startAt.toDate().getTime() > nowMs)
       .sort((a, b) => a.startAt.toDate().getTime() - b.startAt.toDate().getTime());

     if (futureTrainings.length > 0) {
       trainingId = futureTrainings[0].id;
       return trainingId;
     }

     throw new Error("선택 가능한 훈련 없음");
   }

   /********************************************************
    * 8. 훈련 / 명단 구독
    ********************************************************/
   function subscribeTraining() {
     try {
       ensureFirebaseReady();

       if (unsubscribeTraining) unsubscribeTraining();

       unsubscribeTraining = trainingRef().onSnapshot(
         async (doc) => {
           if (!doc.exists) {
             showFatalError("해당 비상대응훈련 정보를 찾을 수 없습니다.");
             return;
           }

           trainingData = {
             id: doc.id,
             ...doc.data()
           };

           $("trainingNameText").textContent = trainingData.trainingName || "비상대응훈련";
           $("listTrainingName").textContent = trainingData.trainingName || "비상대응훈련";

           setFirebaseState("Firebase 연결 정상", "ok");

           await checkDuplicateActiveTrainingForTeam();

           hideFatalError();
           renderStatus();
           applyTimeBasedView();
           renderList();
         },
         (err) => {
           handleFirestoreError(err, "훈련 정보 불러오기");
         }
       );
     } catch (err) {
       if (err.message !== "Firebase 연결 실패") {
         handleFirestoreError(err, "훈련 정보 연결");
       }
     }
   }

   function subscribeAttendanceList() {
     try {
       ensureFirebaseReady();

       if (isExternal) {
         if (unsubscribeExternalParticipants) unsubscribeExternalParticipants();

         unsubscribeExternalParticipants = externalParticipantsRef().onSnapshot(
           (snapshot) => {
             externalParticipants = snapshot.docs.map((doc) => ({
               id: doc.id,
               ...doc.data()
             }));

             externalParticipants.sort((a, b) => Number(a.order || 0) - Number(b.order || 0));

             renderList();
           },
           (err) => {
             handleFirestoreError(err, "협력·외주 출석 명단 불러오기");
           }
         );

         return;
       }

       if (unsubscribeParticipants) unsubscribeParticipants();

       unsubscribeParticipants = participantsRef()
         .where("teamKey", "==", normalizeTeamKey(teamName))
         .onSnapshot(
           (snapshot) => {
             participants = snapshot.docs.map((doc) => ({
               id: doc.id,
               ...doc.data()
             }));

             participants.sort((a, b) => Number(a.order || 0) - Number(b.order || 0));

             renderList();
           },
           (err) => {
             console.warn("teamKey 조회 실패 또는 권한 오류:", err);
             handleFirestoreError(err, "참석자 명단 불러오기");
           }
         );
     } catch (err) {
       if (err.message !== "Firebase 연결 실패") {
         handleFirestoreError(err, "출석 명단 연결");
       }
     }
   }

   /********************************************************
    * 9. 시간 상태 / 화면 전환
    ********************************************************/
   function getTrainingStatus() {
     if (!trainingData || !trainingData.startAt || !trainingData.endAt) {
       return {
         code: "invalid",
         text: "시간 미설정"
       };
     }

     const now = Date.now();
     const start = trainingData.startAt.toDate().getTime();
     const end = trainingData.endAt.toDate().getTime();

     if (now < start) {
       return {
         code: "wait",
         text: "출석 시작 전"
       };
     }

     if (now >= start && now <= end) {
       return {
         code: "open",
         text: "출석 가능"
       };
     }

     return {
       code: "closed",
       text: "출석 종료"
     };
   }

   function renderStatus() {
     const status = getTrainingStatus();
     const pill = $("statusPill");

     pill.textContent = status.text;

     if (duplicateActiveTrainingDetected) {
       pill.textContent = "중복 훈련 감지";
       pill.className = "status-pill error";
       return;
     }

     if (status.code === "open") {
       pill.className = "status-pill open";
     } else if (status.code === "wait") {
       pill.className = "status-pill wait";
     } else if (status.code === "closed") {
       pill.className = "status-pill closed";
     } else {
       pill.className = "status-pill error";
     }
   }

   function applyTimeBasedView() {
     const status = getTrainingStatus();

     if (
       status.code === "open" &&
       !userCheckedInThisSession &&
       !duplicateActiveTrainingDetected
     ) {
       showCheckForm(false);
       return;
     }

     showListOnly(false);
   }

   function showCheckForm(force = true) {
     const status = getTrainingStatus();

     if (status.code !== "open") {
       showListOnly();
       return;
     }

     if (duplicateActiveTrainingDetected) {
       setMessage(
         "동일 시간대에 이 팀이 포함된 다른 비상대응훈련이 감지되어 출석체크가 제한됩니다.",
         "error"
       );
       showListOnly();
       return;
     }

     $("fatalView").classList.add("hidden");
     $("checkView").classList.remove("hidden");
     $("listView").classList.add("hidden");

     if (isExternal) {
       $("internalForm").classList.add("hidden");
       $("externalForm").classList.remove("hidden");
     } else {
       $("internalForm").classList.remove("hidden");
       $("externalForm").classList.add("hidden");
     }

     $("backToCheckBtn").classList.add("hidden");

     if (force) {
       setMessage("", "");
     }
   }

   function showListOnly(force = true) {
     $("fatalView").classList.add("hidden");
     $("checkView").classList.add("hidden");
     $("listView").classList.remove("hidden");

     const status = getTrainingStatus();

     const canGoBack =
       status.code === "open" &&
       !duplicateActiveTrainingDetected &&
       !userCheckedInThisSession;

     $("backToCheckBtn").classList.toggle("hidden", !canGoBack);

     if (force) {
       renderList();
     }
   }

   /********************************************************
    * 10. 일반 팀 출석체크
    ********************************************************/
   async function checkInternalAttendance() {
     try {
       ensureFirebaseReady();

       const status = getTrainingStatus();

       if (status.code !== "open") {
         setMessage("현재는 출석체크 가능 시간이 아닙니다.", "error");
         showListOnly();
         return;
       }

       if (duplicateActiveTrainingDetected) {
         setMessage("동일 시간대 중복 훈련이 있어 출석체크가 제한됩니다.", "error");
         showListOnly();
         return;
       }

       const empNo = $("empNoInput").value.trim();

       if (!empNo) {
         setMessage("사번을 입력해주세요.", "error");
         return;
       }

       let docRef = participantsRef().doc(makeSafeDocId(empNo));
       let doc = await docRef.get();

       if (!doc.exists) {
         const query = await participantsRef()
           .where("empNo", "==", empNo)
           .limit(1)
           .get();

         if (query.empty) {
           setMessage("등록된 참석자 명단에서 해당 사번을 찾을 수 없습니다.", "error");
           return;
         }

         doc = query.docs[0];
         docRef = doc.ref;
       }

       const person = doc.data();

       if (normalizeTeamKey(person.team) !== normalizeTeamKey(teamName)) {
         setMessage("입력한 사번은 현재 팀의 참석자 명단에 없습니다.", "error");
         return;
       }

       if (person.checked === true) {
         setMessage("이미 출석체크가 완료된 참석자입니다.", "warn");
         userCheckedInThisSession = true;
         setTimeout(() => showListOnly(), 500);
         return;
       }

       await docRef.set({
         checked: true,
         checkTime: firebase.firestore.FieldValue.serverTimestamp(),
         checkedTeam: teamName,
         checkedTeamKey: normalizeTeamKey(teamName),
         checkedByPage: "participant",
         updatedAt: firebase.firestore.FieldValue.serverTimestamp()
       }, { merge: true });

       setMessage("출석체크가 완료되었습니다.", "ok");
       userCheckedInThisSession = true;
       $("empNoInput").value = "";

       setTimeout(() => {
         showListOnly();
       }, 500);
     } catch (err) {
       if (err.message === "Firebase 연결 실패") {
         setMessage("Firebase 연결에 실패했습니다. 관리자에게 문의해주세요.", "error");
         return;
       }

       console.error(err);

       if (err.code === "permission-denied") {
         setMessage("출석체크 권한이 없습니다. Firestore Rules를 확인해주세요.", "error");
       } else {
         setMessage("출석체크 중 오류가 발생했습니다.", "error");
       }
     }
   }

   /********************************************************
    * 11. 협력·외주 출석체크
    ********************************************************/
   async function checkExternalAttendance() {
     try {
       ensureFirebaseReady();

       const status = getTrainingStatus();

       if (status.code !== "open") {
         setMessage("현재는 출석체크 가능 시간이 아닙니다.", "error");
         showListOnly();
         return;
       }

       const affiliation = $("affiliationInput").value.trim();
       const name = $("externalNameInput").value.trim();

       if (!affiliation || !name) {
         setMessage("소속과 성명을 모두 입력해주세요.", "error");
         return;
       }

       await db.runTransaction(async (transaction) => {
         const tRef = trainingRef();
         const tSnap = await transaction.get(tRef);

         if (!tSnap.exists) {
           throw new Error("훈련 정보 없음");
         }

         const currentCounter = Number(tSnap.data().externalCounter || 0);
         const nextOrder = currentCounter + 1;
         const newRef = externalParticipantsRef().doc();

         transaction.update(tRef, {
           externalCounter: firebase.firestore.FieldValue.increment(1),
           updatedAt: firebase.firestore.FieldValue.serverTimestamp()
         });

         transaction.set(newRef, {
           order: nextOrder,
           team: "협력·외주",
           affiliation,
           name,
           checked: true,
           checkTime: firebase.firestore.FieldValue.serverTimestamp(),
           checkedByPage: "participant-external",
           createdAt: firebase.firestore.FieldValue.serverTimestamp(),
           updatedAt: firebase.firestore.FieldValue.serverTimestamp()
         });
       });

       setMessage("출석체크가 완료되었습니다.", "ok");
       userCheckedInThisSession = true;
       $("affiliationInput").value = "";
       $("externalNameInput").value = "";

       setTimeout(() => {
         showListOnly();
       }, 500);
     } catch (err) {
       if (err.message === "Firebase 연결 실패") {
         setMessage("Firebase 연결에 실패했습니다. 관리자에게 문의해주세요.", "error");
         return;
       }

       console.error(err);

       if (err.code === "permission-denied") {
         setMessage("출석체크 권한이 없습니다. Firestore Rules를 확인해주세요.", "error");
       } else {
         setMessage("출석체크 중 오류가 발생했습니다.", "error");
       }
     }
   }

   /********************************************************
    * 12. 명단 렌더링
    ********************************************************/
   function renderList() {
     if (!trainingData) return;

     $("listTitle").textContent = teamName;
     $("currentTime").textContent = formatKoreanDateTime(new Date());

     if (isExternal) {
       renderExternalTable();
     } else {
       renderInternalTable();
     }

     renderListInfo();
   }

   function renderInternalTable() {
     $("tableHead").innerHTML = `
       <tr>
         <th class="col-no">순번</th>
         <th class="col-team">팀명</th>
         <th class="col-name">성명</th>
         <th class="col-check">출석체크</th>
         <th class="col-time">출석 시간</th>
       </tr>
     `;

     if (participants.length === 0) {
       $("tableBody").innerHTML = `
         <tr>
           <td colspan="5" class="empty-row">현재 팀에 등록된 참석자 명단이 없습니다.</td>
         </tr>
       `;
       return;
     }

     $("tableBody").innerHTML = participants.map((p, index) => {
       const checked = p.checked === true;
       const checkedText = checked ? "완료" : "";
       const timeText = checked && p.checkTime ? formatKst(p.checkTime) : "";

       return `
         <tr>
           <td>${escapeHtml(p.order ?? index + 1)}</td>
           <td>${escapeHtml(p.team ?? "")}</td>
           <td>${escapeHtml(p.name ?? "")}</td>
           <td class="${checked ? "complete" : ""}">${checkedText}</td>
           <td>${escapeHtml(timeText)}</td>
         </tr>
       `;
     }).join("");
   }

   function renderExternalTable() {
     $("tableHead").innerHTML = `
       <tr>
         <th class="col-no">순번</th>
         <th class="col-affiliation">소속</th>
         <th class="col-name">성명</th>
         <th class="col-check">출석체크</th>
         <th class="col-time">출석 시간</th>
       </tr>
     `;

     if (externalParticipants.length === 0) {
       $("tableBody").innerHTML = `
         <tr>
           <td colspan="5" class="empty-row">아직 출석체크한 협력·외주 참석자가 없습니다.</td>
         </tr>
       `;
       return;
     }

     $("tableBody").innerHTML = externalParticipants.map((p, index) => {
       const checked = p.checked === true;
       const checkedText = checked ? "완료" : "";
       const timeText = checked && p.checkTime ? formatKst(p.checkTime) : "";

       return `
         <tr>
           <td>${escapeHtml(p.order ?? index + 1)}</td>
           <td>${escapeHtml(p.affiliation ?? "")}</td>
           <td>${escapeHtml(p.name ?? "")}</td>
           <td class="${checked ? "complete" : ""}">${checkedText}</td>
           <td>${escapeHtml(timeText)}</td>
         </tr>
       `;
     }).join("");
   }

   function renderListInfo() {
     if (!trainingData) {
       $("listInfo").textContent = "-";
       return;
     }

     const status = getTrainingStatus();

     let total = 0;
     let checked = 0;

     if (isExternal) {
       total = externalParticipants.length;
       checked = externalParticipants.filter((p) => p.checked === true).length;
     } else {
       total = participants.length;
       checked = participants.filter((p) => p.checked === true).length;
     }

     const period =
       trainingData.startAt && trainingData.endAt
         ? `${formatKoreanDateTime(trainingData.startAt)} ~ ${formatKoreanDateTime(trainingData.endAt)}`
         : "출석 가능 시간 미설정";

     let extra = "";

     if (duplicateActiveTrainingDetected) {
       extra = " · 동일 시간대 중복 훈련 감지";
     }

     $("listInfo").textContent =
       `상태: ${status.text}${extra} · 출석 ${checked}명 / 대상 ${total}명 · ${period}`;
   }

   /********************************************************
    * 13. 동일 시간대 팀 중복 훈련 감지
    ********************************************************/
   async function checkDuplicateActiveTrainingForTeam() {
     duplicateActiveTrainingDetected = false;

     if (isExternal || !teamName || !trainingData) return;

     try {
       const now = new Date();
       const nowTs = firebase.firestore.Timestamp.fromDate(now);
       const currentTeamKey = normalizeTeamKey(teamName);

       const snapshot = await db.collection("emergencyTrainings")
         .where("startAt", "<=", nowTs)
         .get();

       const activeTrainings = snapshot.docs
         .map((doc) => ({
           id: doc.id,
           ...doc.data()
         }))
         .filter((training) => {
           if (!training.endAt) return false;
           return training.endAt.toDate().getTime() >= now.getTime();
         });

       const matchedTrainingIds = [];

       activeTrainings.forEach((training) => {
         let keys = [];

         if (Array.isArray(training.teamKeys)) {
           keys = training.teamKeys;
         } else if (Array.isArray(training.teams)) {
           keys = training.teams.map((team) => normalizeTeamKey(team));
         }

         if (keys.includes(currentTeamKey)) {
           matchedTrainingIds.push(training.id);
         }
       });

       duplicateActiveTrainingDetected = matchedTrainingIds.length >= 2;
     } catch (err) {
       console.warn("중복 훈련 확인 실패:", err);
       duplicateActiveTrainingDetected = false;
     }
   }

   /********************************************************
    * 14. 오류 화면
    ********************************************************/
   function showFatalError(message) {
     $("fatalBox").innerHTML = message;
     $("fatalView").classList.remove("hidden");
     $("checkView").classList.add("hidden");
     $("listView").classList.add("hidden");
   }

   function hideFatalError() {
     $("fatalView").classList.add("hidden");
   }

   /********************************************************
    * 15. 보조 함수
    ********************************************************/
   function setMessage(text, type) {
     const el = $("formMessage");
     el.innerHTML = text || "";
     el.className = `message ${type || ""}`;
   }

   function makeSafeDocId(value) {
     return String(value).trim().replace(/[\/\\#?]/g, "_");
   }

   function normalizeText(value) {
     return String(value || "")
       .trim()
       .replace(/\s+/g, "")
       .replaceAll("ㆍ", "·")
       .replaceAll("/", "·")
       .toLowerCase();
   }

   function normalizeTeamKey(value) {
     return normalizeText(value);
   }

   function escapeHtml(value) {
     return String(value)
       .replaceAll("&", "&amp;")
       .replaceAll("<", "&lt;")
       .replaceAll(">", "&gt;")
       .replaceAll('"', "&quot;")
       .replaceAll("'", "&#039;");
   }

   window.addEventListener("DOMContentLoaded", init);
 </script>
